[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gnat-trap"
version = "1.1.0"
description = "Modular prompt-injection / jailbreak detection library"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Fredrick McFadden" }]
keywords = ["prompt-injection", "jailbreak", "ai-security", "guardrail", "llm-security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Red-TheViper/gnat-trap"
Repository = "https://github.com/Red-TheViper/gnat-trap"

[tool.setuptools.packages.find]
where = ["."]
include = ["gnat_trap*"]
